# Pubblica una release GitHub quando si pusha un tag `vX.Y.Z`.
#
#   git tag -a v2.0.0 -m "Rizzo PII 2.0.0" && git push origin v2.0.0
#
# Usa il GITHUB_TOKEN che Actions inietta da solo: niente PAT, niente gh CLI, nessuna
# action di terzi. Le note sono `docs/releases/<tag>.md` se il file esiste, piu' le note
# generate da GitHub (commit e PR dal tag precedente) che l'API accoda da sola.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crea o aggiorna la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")

          NOTES_FILE="docs/releases/${TAG}.md"
          BODY=""
          [ -f "$NOTES_FILE" ] && BODY="$(cat "$NOTES_FILE")"

          # Note generate da GitHub (commit e PR dal tag precedente), accodate a mano: il campo
          # generate_release_notes vale solo in creazione, e qui la release puo' gia' esistere.
          GENERATED="$(curl -fsS -X POST "${auth[@]}" "$API/releases/generate-notes" \
            -d "$(jq -n --arg tag "$TAG" '{tag_name: $tag}')" | jq -r .body)"
          BODY="$(printf '%s\n\n%s' "$BODY" "$GENERATED")"

          jq -n --arg tag "$TAG" --arg name "Rizzo PII ${TAG#v}" --arg body "$BODY" \
            '{tag_name: $tag, name: $name, body: $body}' > payload.json

          # Se la release del tag esiste gia' si aggiorna (ri-pushare il tag corregge le note),
          # altrimenti si crea. -f fa fallire il job su 4xx/5xx; il 404 della GET e' atteso.
          ID="$(curl -sS "${auth[@]}" "$API/releases/tags/$TAG" | jq -r '.id // empty')"
          if [ -n "$ID" ]; then
            curl -fsS -X PATCH "${auth[@]}" "$API/releases/$ID" -d @payload.json > response.json
          else
            curl -fsS -X POST "${auth[@]}" "$API/releases" -d @payload.json > response.json
          fi

          echo "Release: $(jq -r .html_url response.json)"
