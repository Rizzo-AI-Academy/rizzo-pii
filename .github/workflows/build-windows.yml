# Compila l'app desktop Windows (sidecar PyInstaller + bundle Tauri NSIS) e allega
# l'installer alla release del tag.
#
#   git tag -a v2.0.1 -m "Rizzo PII 2.0.1" && git push origin v2.0.1
#
# Serve un runner Windows: PyInstaller non cross-compila e il sidecar e' Python+torch,
# quindi da macOS/Linux (Docker compreso) l'.exe non si puo' produrre.
#
# Il modello e' gitignorato (1,23 GB): si scarica da Hugging Face, repo PUBBLICO
# rizzoaiacademy/rizzo-pii-0.3B branch v1.5.0 -> nessun token.
#
# Complementare a release.yml (che crea/aggiorna la release del tag su ubuntu in pochi
# secondi): qui si aspetta che quella release esista e le si allega l'installer.
name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag di una release gia' esistente a cui allegare l'installer (vuoto = solo artifact del run)"
        required: false
        type: string

permissions:
  contents: write

env:
  MODEL_REPO: rizzoaiacademy/rizzo-pii-0.3B
  MODEL_REV: v1.5.0
  MODEL_DIR: models/rizzo-pii-0.3B-v1.5.0 # deve combaciare con build_sidecar.spec

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Rust e' gia' installato sui runner windows-latest (rustup + toolchain stable).
      - name: Versioni della toolchain
        run: |
          rustc --version
          cargo --version
          python --version

      - name: Cache di cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tauri/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # torch dall'indice cpu: il wheel di default su Windows tira dentro CUDA (~2,5 GB
      # di roba inutile qui, e il runner ha poco disco).
      - name: Dipendenze Python (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir "transformers==4.57.3" tokenizers safetensors `
            flask pymupdf pyinstaller "huggingface_hub[cli]"

      - name: Scarica il modello da Hugging Face
        run: |
          hf download "$env:MODEL_REPO" --revision "$env:MODEL_REV" --local-dir "$env:MODEL_DIR"
          if (-not (Test-Path "$env:MODEL_DIR/model.safetensors")) {
            throw "modello non scaricato: $env:MODEL_DIR/model.safetensors mancante"
          }

      - name: Sidecar PyInstaller
        run: |
          if (Test-Path tauri/src-tauri/backend) { Remove-Item -Recurse -Force tauri/src-tauri/backend }
          pyinstaller build_sidecar.spec --noconfirm `
            --distpath tauri/src-tauri/backend --workpath build/sidecar_work
          if (-not (Test-Path tauri/src-tauri/backend/pii-backend/pii-backend.exe)) {
            throw "sidecar non prodotto"
          }
          # la copia di lavoro di PyInstaller pesa quanto il dist: il runner ha ~25 GB liberi
          Remove-Item -Recurse -Force build/sidecar_work

      - name: Build Tauri + installer NSIS
        working-directory: tauri
        run: |
          npm install
          npx tauri build

      # Tauri lo chiama "Rizzo PII_2.0.0_x64-setup.exe": si rinomina nella convenzione degli
      # altri artefatti della release (Rizzo-PII-2.0.0-macOS-arm64.dmg, ...-Linux-x86_64.AppImage),
      # a cui puntano i link della landing in docs/index.html. Gli spazi andrebbero comunque
      # percent-encoded nell'URL di upload.
      - name: Individua l'installer
        id: installer
        run: |
          $exe = Get-ChildItem tauri/src-tauri/target/release/bundle/nsis/*-setup.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "installer NSIS non trovato" }
          $ver = (Get-Content tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dest = Join-Path $exe.DirectoryName "Rizzo-PII-$ver-Windows-Setup.exe"
          if ($exe.FullName -ne $dest) { Move-Item -Force $exe.FullName $dest }
          $size = [math]::Round((Get-Item $dest).Length / 1GB, 2)
          Write-Host "installer: $dest ($size GB)"
          "path=$dest"                        >> $env:GITHUB_OUTPUT
          "name=$(Split-Path $dest -Leaf)"    >> $env:GITHUB_OUTPUT

      # Dispatch senza release_tag: l'installer resta scaricabile dalla pagina del run
      # (solo per chi ha accesso al repo, e scade). Per la landing serve un asset di release.
      - name: Artifact del run
        if: github.ref_type != 'tag' && !inputs.release_tag
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: ${{ steps.installer.outputs.path }}
          retention-days: 5
          compression-level: 0 # l'NSIS e' gia' compresso

      # Con un tag: si allega alla release creata da release.yml. Da dispatch: alla release
      # indicata in release_tag (utile per riempire una release gia' pubblicata senza
      # scaricare e ricaricare 1,3 GB da casa). Stesso GITHUB_TOKEN, nessuna action di terzi.
      - name: Allega l'installer alla release
        if: github.ref_type == 'tag' || inputs.release_tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO: ${{ github.repository }}
          ASSET: ${{ steps.installer.outputs.path }}
          ASSET_NAME: ${{ steps.installer.outputs.name }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")

          # release.yml gira in parallelo e finisce in pochi secondi, ma non e' garantito:
          # si aspetta la release del tag fino a 5 minuti.
          ID=""
          for _ in $(seq 1 30); do
            ID="$(curl -sS "${auth[@]}" "$API/releases/tags/$TAG" | jq -r '.id // empty')"
            [ -n "$ID" ] && break
            echo "release $TAG non ancora pubblicata, riprovo..."
            sleep 10
          done
          [ -n "$ID" ] || { echo "ERRORE: release $TAG inesistente"; exit 1; }

          # Un asset con lo stesso nome non si sovrascrive: va cancellato (ri-push del tag).
          OLD="$(curl -sS "${auth[@]}" "$API/releases/$ID/assets" \
                 | jq -r --arg n "$ASSET_NAME" '.[] | select(.name == $n) | .id')"
          [ -n "$OLD" ] && curl -fsS -X DELETE "${auth[@]}" "$API/releases/assets/$OLD"

          # -T invece di --data-binary: streaming, non carica 1,8 GB in RAM.
          curl -fsS -X POST "${auth[@]}" \
            -H "Content-Type: application/octet-stream" \
            -T "$ASSET" \
            "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=$ASSET_NAME" \
            > upload.json
          echo "Asset: $(jq -r .browser_download_url upload.json)"
