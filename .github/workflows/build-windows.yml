# Compila l'app desktop Windows (sidecar PyInstaller + bundle Tauri NSIS) e allega
# alla release del tag DUE installer: leggero (scarica il modello da Hugging Face al
# primo avvio) e offline (modello dentro).
#
#   git tag -a v2.0.1 -m "Rizzo PII 2.0.1" && git push origin v2.0.1
#
# Serve un runner Windows: PyInstaller non cross-compila, quindi da macOS/Linux (Docker
# compreso) l'.exe non si puo' produrre.
#
# Il sidecar NON contiene torch: inferenza con onnxruntime su onnx/model.onnx (fp32), che si
# scarica gia' pronto da Hugging Face. torch qui non si installa nemmeno.
#
# Il modello e' gitignorato (ONNX, 1,2 GB): si scarica da Hugging Face, repo PUBBLICO
# rizzoaiacademy/rizzo-pii-0.3B branch v1.5.0 -> nessun token.
#
# Complementare a release.yml (che crea/aggiorna la release del tag su ubuntu in pochi
# secondi): qui si aspetta che quella release esista e le si allega l'installer.
name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag di una release gia' esistente a cui allegare l'installer (vuoto = solo artifact del run)"
        required: false
        type: string

permissions:
  contents: write

env:
  MODEL_REPO: rizzoaiacademy/rizzo-pii-0.3B
  MODEL_REV: v1.5.0
  MODEL_DIR: models/rizzo-pii-0.3B-v1.5.0 # deve combaciare con build_sidecar.spec

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Rust e' gia' installato sui runner windows-latest (rustup + toolchain stable).
      - name: Versioni della toolchain
        run: |
          rustc --version
          cargo --version
          python --version

      - name: Cache di cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tauri/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Niente torch: il sidecar gira su onnxruntime e il modello ONNX e' gia' su HF.
      - name: Dipendenze Python (CPU, senza torch)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir tokenizers numpy onnxruntime `
            flask pymupdf pyinstaller "huggingface_hub[cli]"

      # Solo i file che finiscono nel sidecar: il grafo ONNX + i pesi (fp32, gli stessi del
      # model.safetensors, esportati e verificati con src/training/export_onnx.py) e il
      # tokenizer. Il model.safetensors (1,2 GB) non serve e non si scarica.
      - name: Scarica il modello ONNX da Hugging Face
        run: |
          # file elencati uno per uno: con piu' valori, --include ne prende solo il primo e
          # tratta gli altri come nomi di file, saltando in silenzio onnx/.
          hf download "$env:MODEL_REPO" onnx/model.onnx onnx/model.onnx_data `
            config.json tokenizer.json tokenizer_config.json special_tokens_map.json `
            --revision "$env:MODEL_REV" --local-dir "$env:MODEL_DIR"
          foreach ($f in "onnx/model.onnx", "onnx/model.onnx_data", "tokenizer.json", "config.json") {
            if (-not (Test-Path "$env:MODEL_DIR/$f")) { throw "modello non scaricato: $env:MODEL_DIR/$f mancante" }
          }

      # Sidecar SENZA modello (PII_BUNDLE_MODEL=0): e' la base di entrambi gli installer.
      - name: Sidecar PyInstaller (senza modello)
        env:
          PII_BUNDLE_MODEL: "0"
        run: |
          if (Test-Path tauri/src-tauri/backend) { Remove-Item -Recurse -Force tauri/src-tauri/backend }
          pyinstaller build_sidecar.spec --noconfirm `
            --distpath tauri/src-tauri/backend --workpath build/sidecar_work
          if (-not (Test-Path tauri/src-tauri/backend/pii-backend/pii-backend.exe)) {
            throw "sidecar non prodotto"
          }
          if (Test-Path tauri/src-tauri/backend/pii-backend/_internal/pii_model) {
            throw "il sidecar leggero non deve contenere il modello"
          }
          # la copia di lavoro di PyInstaller pesa quanto il dist: il runner ha ~25 GB liberi
          Remove-Item -Recurse -Force build/sidecar_work

      # Due installer dalla stessa build Rust:
      #   Rizzo-PII-<ver>-Windows-Setup.exe          leggero (~90 MB): al primo avvio
      #       l'app scarica il modello da Hugging Face (tauri/src-tauri/src/model.rs);
      #   Rizzo-PII-<ver>-Windows-Setup-offline.exe  completo (~1,15 GB): modello dentro,
      #       per PC senza internet o reti che bloccano huggingface.co.
      # La seconda "tauri build" ricompila poco o niente: cambia solo il contenuto delle risorse.
      # Il nome del leggero e' quello di sempre, a cui puntano i link della landing (docs/index.html).
      - name: Build Tauri + installer NSIS (leggero e offline)
        id: installer
        run: |
          $ver = (Get-Content tauri/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $out = New-Item -ItemType Directory -Force installer_out
          $nsis = "tauri/src-tauri/target/release/bundle/nsis"

          Push-Location tauri
          npm install
          npx tauri build
          if ($LASTEXITCODE -ne 0) { throw "tauri build (leggero) fallito" }
          Pop-Location
          $exe = Get-ChildItem "$nsis/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer NSIS (leggero) non trovato" }
          $lite = Join-Path $out "Rizzo-PII-$ver-Windows-Setup.exe"
          Move-Item -Force $exe.FullName $lite

          # stesso layout che produce build_sidecar.spec con PII_BUNDLE_MODEL=1
          $pm = New-Item -ItemType Directory -Force tauri/src-tauri/backend/pii-backend/_internal/pii_model
          Copy-Item "$env:MODEL_DIR/onnx/model.onnx", "$env:MODEL_DIR/onnx/model.onnx_data" $pm
          foreach ($f in "config.json", "tokenizer.json", "tokenizer_config.json", "special_tokens_map.json") {
            Copy-Item "$env:MODEL_DIR/$f" $pm
          }
          Push-Location tauri
          npx tauri build
          if ($LASTEXITCODE -ne 0) { throw "tauri build (offline) fallito" }
          Pop-Location
          $exe = Get-ChildItem "$nsis/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer NSIS (offline) non trovato" }
          $full = Join-Path $out "Rizzo-PII-$ver-Windows-Setup-offline.exe"
          Move-Item -Force $exe.FullName $full

          foreach ($f in $lite, $full) {
            Write-Host ("installer: {0} ({1:N2} GB)" -f $f, ((Get-Item $f).Length / 1GB))
          }
          "dir=$($out.FullName)" >> $env:GITHUB_OUTPUT

      # Dispatch senza release_tag: gli installer restano scaricabili dalla pagina del run
      # (solo per chi ha accesso al repo, e scadono). Per la landing serve un asset di release.
      - name: Artifact del run
        if: github.ref_type != 'tag' && !inputs.release_tag
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: ${{ steps.installer.outputs.dir }}/*.exe
          retention-days: 5
          compression-level: 0 # l'NSIS e' gia' compresso

      # Con un tag: si allegano alla release creata da release.yml. Da dispatch: alla release
      # indicata in release_tag. Stesso GITHUB_TOKEN, nessuna action di terzi.
      - name: Allega gli installer alla release
        if: github.ref_type == 'tag' || inputs.release_tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          REPO: ${{ github.repository }}
          OUT: ${{ steps.installer.outputs.dir }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")

          # release.yml gira in parallelo e finisce in pochi secondi, ma non e' garantito:
          # si aspetta la release del tag fino a 5 minuti.
          ID=""
          for _ in $(seq 1 30); do
            ID="$(curl -sS "${auth[@]}" "$API/releases/tags/$TAG" | jq -r '.id // empty')"
            [ -n "$ID" ] && break
            echo "release $TAG non ancora pubblicata, riprovo..."
            sleep 10
          done
          [ -n "$ID" ] || { echo "ERRORE: release $TAG inesistente"; exit 1; }

          for ASSET in "$OUT"/*.exe; do
            ASSET_NAME="$(basename "$ASSET")"
            # Un asset con lo stesso nome non si sovrascrive: va cancellato (ri-push del tag).
            OLD="$(curl -sS "${auth[@]}" "$API/releases/$ID/assets" \
                   | jq -r --arg n "$ASSET_NAME" '.[] | select(.name == $n) | .id')"
            [ -n "$OLD" ] && curl -fsS -X DELETE "${auth[@]}" "$API/releases/assets/$OLD"

            # -T invece di --data-binary: streaming, non carica 1,2 GB in RAM.
            curl -fsS -X POST "${auth[@]}" \
              -H "Content-Type: application/octet-stream" \
              -T "$ASSET" \
              "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=$ASSET_NAME" \
              > upload.json
            echo "Asset: $(jq -r .browser_download_url upload.json)"
          done
